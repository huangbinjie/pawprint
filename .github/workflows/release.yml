name: Build and release desktop apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac-arm64:
    runs-on: macos-15
    env:
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm test
      - name: Select signing mode
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8_BASE64" ] && [ -n "$EXPECTED_TEAM_ID" ]; then
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
            test -s "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "PAWPRINT_SIGNING=developer-id" >> "$GITHUB_ENV"
          elif [ -z "$CSC_LINK$CSC_KEY_PASSWORD$APPLE_API_KEY_ID$APPLE_API_ISSUER$APPLE_API_KEY_P8_BASE64$EXPECTED_TEAM_ID" ]; then
            echo "PAWPRINT_SIGNING=adhoc" >> "$GITHUB_ENV"
          else
            echo 'Signing credentials are incomplete; refusing to publish.' >&2
            exit 1
          fi
      - name: Package Apple silicon app
        run: |
          if [ "$PAWPRINT_SIGNING" = developer-id ]; then
            npm run package
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_P8_BASE64 EXPECTED_TEAM_ID
            npm run package:local
          fi
      - name: Verify complete bundle signature
        run: |
          APP=release/mac-arm64/Pawprint.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2> "$RUNNER_TEMP/codesign-info.txt"
          if [ "$PAWPRINT_SIGNING" = developer-id ]; then
            grep -q 'Authority=Developer ID Application:' "$RUNNER_TEMP/codesign-info.txt"
            grep -q "TeamIdentifier=$EXPECTED_TEAM_ID" "$RUNNER_TEMP/codesign-info.txt"
            xcrun stapler staple "$APP"
            xcrun stapler validate "$APP"
            spctl --assess --type execute --verbose=4 "$APP"
          else
            grep -q 'Signature=adhoc' "$RUNNER_TEMP/codesign-info.txt"
          fi
      - name: Prepare archive and checksum
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' release/mac-arm64/Pawprint.app/Contents/Info.plist)" = "$VERSION"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Pawprint.app "artifacts/Pawprint-$VERSION-mac-arm64.zip"
          cd artifacts
          shasum -a 256 "Pawprint-$VERSION-mac-arm64.zip" > "Pawprint-$VERSION-mac-arm64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pawprint-mac-arm64
          path: artifacts/*
      - name: Prepare draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PAWPRINT_SIGNING" = adhoc ]; then
            cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Apple silicon Mac beta. This app is ad-hoc signed so its bundle contents can be checked, but it is not Apple Developer ID signed or notarized.

          Apple 芯片 Mac 内测版：使用临时封装签名，尚未进行 Apple Developer ID 签名或公证。请核对下载文件与附带的 SHA-256 校验文件。

          On first launch after downloading, macOS may say Apple cannot verify Pawprint. Click Done, then open System Settings → Privacy & Security → Open Anyway for Pawprint, and confirm. You can also right-click the app and choose Open. Verify the downloaded zip against the included SHA-256 file. Do not disable Gatekeeper globally. If macOS says the app is damaged, stop and report it instead of forcing it open.

          首次打开若提示无法验证开发者，请点“完成”，再到“系统设置 → 隐私与安全性”选择 Pawprint 的“仍要打开”并确认；也可右键应用选择“打开”。不要全局关闭 Gatekeeper。若提示应用“已损坏”，请停止并反馈。
          NOTES
          else
            printf '%s\n' 'Developer ID-signed and Apple-notarized Mac build.' 'Mac 版本已使用 Developer ID 签名并通过 Apple 公证。' > "$RUNNER_TEMP/release-notes.md"
          fi
          cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          Windows 10/11 x64: download the `Pawprint-*-win-x64-setup.exe` installer and its SHA-256 file below. This Windows beta is unsigned. Its packaged app is built and smoke-tested on Windows CI; interactive desktop and cross-platform LAN behavior still need hands-on verification. Version 0.11.10 and later support verified in-app updates and preserve the save. Version 0.11.9 and earlier need one manual installation to gain this feature. Windows ARM64-native builds are not included.

          Windows 10/11 x64：下载下方的 `Pawprint-*-win-x64-setup.exe` 安装包及 SHA-256 校验文件。本内测包未签名；CI 会构建并执行基本运行检查，桌面交互和跨平台局域网体验仍需实机验证。0.11.10 及以上支持保留存档的应用内更新；更旧版本需先手动安装一次。不包含 Windows ARM64 原生版。
          NOTES
          RELEASE_TITLE="$GITHUB_REF_NAME"
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            RELEASE_TITLE=$(sed -n '1s/^# //p' "docs/releases/$GITHUB_REF_NAME.md")
            grep -q '^## 中文' "docs/releases/$GITHUB_REF_NAME.md"
            grep -q '^## English' "docs/releases/$GITHUB_REF_NAME.md"
            cat "docs/releases/$GITHUB_REF_NAME.md" >> "$RUNNER_TEMP/release-notes.md"
          elif [ "$GITHUB_REF_NAME" = v0.12.0 ]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ## Pawprint 0.12.0
          - QR pet visiting cards: share public genes and temperament, import a QR image, invite a read-only visitor, copy a two-cat photo and leave pawprints. No server required.
          - Wiggle the pointer over your cat to catch its attention and start a short chase. Everyday gestures and owned tricks can happen naturally.
          - Growing temperament and local interaction-day records; quiet proactive greetings with daily limits and nighttime silence.
          - Three local conversation model recommendations, a GitHub-hosted catalog, automatic engine preparation, download progress, active-model display and uninstall controls. Voice recognition is not included yet.
          - Clearer update download/verification stages and installer readiness checks.
          NOTES
          elif [ "$GITHUB_REF_NAME" = v0.12.1 ]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ## Pawprint 0.12.1
          - Automatic models.dev pricing updates, cached for offline use, with provider-aware pricing for API-key models used through Codex.
          - 30-day usage history, daily priced costs, pending pricing and per-model input, cache-read, cache-write and output token details.
          - Claim rewards for priced usage while unknown models await pricing. Newly priced usage is credited once; repeated refreshes do not duplicate rewards.
          - Correct handling of inherited parent metadata in subagent logs and empty usage baselines during upgrades.
          - Improved QR visiting-card spacing and image import buttons; the native file input stays hidden.
          - Clearer usage typography and complete English text for populated reports, pricing states and daily tables.
          NOTES
          elif [ "$GITHUB_REF_NAME" = v0.15.0 ]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ## Pawprint 0.15.0 — Keep your account, choose your connection
          - macOS: preserve recognized file-based ChatGPT identity when using custom Providers, including across Codex restarts. A loopback inference bridge replaces ChatGPT authentication with the Provider's Keychain API key before forwarding. Keep Pawprint running and restart Codex once after the first upgrade. The client Usage menu remains ChatGPT account usage, not a third-party balance.
          - Refresh the local Provider indicator after config readback; report refresh delivery without claiming a UI acknowledgement. Silent system switch notifications and notification-settings shortcuts replace custom desktop banners.
          - Review changed configuration fields, back up the current TOML and restore saved connections to ChatGPT with explicit confirmation. New external changes invalidate the review; unrelated settings and login are preserved.
          - Read recent chat Provider/model records independently of current defaults. Unknown and unsaved empty chats are not guessed; no chat message is sent to read this list.
          - Newly claimed first eggs now hatch into a cream tabby with random hidden genes, talents and skills. Existing pets/eggs and later discovery/breeding stay unchanged.
          - Single-click only pets the cat. Right-click opens its menu; double-click returns to work.
          - Provider management is macOS-only. Windows includes the new first companion and gesture changes. Internal client integration can change with Codex updates; API-only connections retain direct Provider authentication.
          NOTES
          elif [ "$GITHUB_REF_NAME" = v0.14.2 ]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ## Pawprint 0.14.2 — Connection switching fix
          - Fix switching back to ChatGPT after changing models in Codex. Normal model selections and equivalent formatting no longer cause configuration conflicts; external provider or connection edits are still protected.
          - Restore the most recent OpenAI model choice after a connection round trip.
          - Show switch progress, success and errors directly beside the connection button.
          - Changing defaults while Codex runs affects new local chats; existing and remote chats are not automatically migrated. Provider management remains macOS-only.
          NOTES
          elif [ "$GITHUB_REF_NAME" = v0.14.1 ]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ## Pawprint 0.14.1 — Codex Assistant
          - One page for connections, chats/reminders, usage and advanced settings, with clearer spacing, generic examples and collapsed local paths.
          - macOS Codex API provider management: Keychain credentials, configuration backups/conflict checks, preserved ChatGPT login, and runtime changes to defaults for new local chats. Existing and remote chats are not silently migrated.
          - Delete the selected provider after restoring ChatGPT defaults. Historical usage retains readable connection names.
          - Optional provider prefixes for verified local third-party chat titles; OpenAI and unverified remote chats remain unchanged.
          - Per-provider token totals and model-catalog reference costs, including input/cache/output pricing. Unmatched models remain unpriced. Reference amounts are not actual gateway bills; reward calculations are unchanged.
          - Existing pets, genes, wallet and preferences are preserved. Provider management is currently macOS-only; Windows retains the other local companion features.
          NOTES
          elif [ "$GITHUB_REF_NAME" = v0.13.3 ]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ## Pawprint 0.13.3
          - Approval signs now follow pending manual requests from compatible desktop IPC. Automatic review no longer raises a sign; answering questions still does.
          - Clear approval signs as soon as requests are resolved, on disconnect, or if the internal IPC stream becomes incompatible. Show subscription availability in client helpers.
          - Remove obsolete Pawprint approval hooks and old approval markers on upgrade, preserving question reminders and unrelated client rules.
          - Desktop IPC is an internal interface and may change with client updates. Approval signs are suppressed when it is unavailable.
          NOTES
          elif [ "$GITHUB_REF_NAME" = v0.13.2 ]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ## Pawprint 0.13.2
          - Fix stale Bash approval signs after a tool completes. Approval and completion events now match even when only the approval event includes a description.
          - Refresh Pawprint's installed hook relay after upgrades while preserving existing client hook rules.
          NOTES
          elif [ "$GITHUB_REF_NAME" = v0.13.1 ]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ## Pawprint 0.13.1 — One double-click back to work
          - Double-click your cat to open the conversation that needs an answer or approval, then the latest unread reply, then the most recent chat. Home remains in the right-click menu.
          - Your cat hops once when a reply ends and holds a readable wooden sign while waiting for your answer or approval. Click the sign to return to that chat.
          - Status bubbles sit closer to the cat and can be clicked. Missed replies keep a small return arrow beside the cat until opened.
          - Removed the floating hover toolbar. Existing pets, genes, balances and preferences are preserved.
          NOTES
          elif [ "$GITHUB_REF_NAME" = v0.13.0 ]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ## Pawprint 0.13.0 — Your work has company
          - Hover over the cat to return to your active or pinned Codex chat. Recent chats show real titles and projects; keep a next-step bookmark beside each one.
          - An amber bell stays when a local question or approval needs you. macOS prepares seven clearly labeled Pawprint hooks; review and trust them in the client. Pawprint never approves or answers for you.
          - Keep unread reply markers, choose a gentle sound or system notification, and use Do Not Disturb. A reply ending is not treated as the whole task finishing.
          - New installs start in English with local usage, quota, session feedback and quiet reminders enabled. Five recent chats load immediately; existing preferences and save data are preserved.
          - Quiet circular hover controls retain 44 px click targets, including at half pet scale. Held presses and repeat clicks stay reliable without opening the home accidentally.
          - Take a short play break, build your cat's bond and decorate its room with earned toys and keepsakes.
          - API chat, local model management and voice shortcuts are retired. Previous provider files remain untouched and are no longer loaded. No API key is needed for the pet or work helpers.
          NOTES
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag --draft

  windows-x64:
    needs: mac-arm64
    uses: ./.github/workflows/windows.yml
    with:
      publish: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write

  publish:
    needs: [mac-arm64, windows-x64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
