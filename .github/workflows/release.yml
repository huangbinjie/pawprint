name: Build and release Mac app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac-arm64:
    runs-on: macos-15
    env:
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm test
      - name: Select signing mode
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8_BASE64" ] && [ -n "$EXPECTED_TEAM_ID" ]; then
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
            test -s "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "PAWPRINT_SIGNING=developer-id" >> "$GITHUB_ENV"
          elif [ -z "$CSC_LINK$CSC_KEY_PASSWORD$APPLE_API_KEY_ID$APPLE_API_ISSUER$APPLE_API_KEY_P8_BASE64$EXPECTED_TEAM_ID" ]; then
            echo "PAWPRINT_SIGNING=adhoc" >> "$GITHUB_ENV"
          else
            echo 'Signing credentials are incomplete; refusing to publish.' >&2
            exit 1
          fi
      - name: Package Apple silicon app
        run: |
          if [ "$PAWPRINT_SIGNING" = developer-id ]; then
            npm run package
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_P8_BASE64 EXPECTED_TEAM_ID
            npm run package:local
          fi
      - name: Verify complete bundle signature
        run: |
          APP=release/mac-arm64/Pawprint.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2> "$RUNNER_TEMP/codesign-info.txt"
          if [ "$PAWPRINT_SIGNING" = developer-id ]; then
            grep -q 'Authority=Developer ID Application:' "$RUNNER_TEMP/codesign-info.txt"
            grep -q "TeamIdentifier=$EXPECTED_TEAM_ID" "$RUNNER_TEMP/codesign-info.txt"
            xcrun stapler staple "$APP"
            xcrun stapler validate "$APP"
            spctl --assess --type execute --verbose=4 "$APP"
          else
            grep -q 'Signature=adhoc' "$RUNNER_TEMP/codesign-info.txt"
          fi
      - name: Prepare archive and checksum
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' release/mac-arm64/Pawprint.app/Contents/Info.plist)" = "$VERSION"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Pawprint.app "artifacts/Pawprint-$VERSION-mac-arm64.zip"
          cd artifacts
          shasum -a 256 "Pawprint-$VERSION-mac-arm64.zip" > "Pawprint-$VERSION-mac-arm64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pawprint-mac-arm64
          path: artifacts/*
      - name: Publish verified GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PAWPRINT_SIGNING" = adhoc ]; then
            cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Apple silicon Mac beta. This app is ad-hoc signed so its bundle contents can be checked, but it is not Apple Developer ID signed or notarized.

          On first launch after downloading, macOS may say Apple cannot verify Pawprint. Click Done, then open System Settings → Privacy & Security → Open Anyway for Pawprint, and confirm. You can also right-click the app and choose Open. Verify the downloaded zip against the included SHA-256 file. Do not disable Gatekeeper globally. If macOS says the app is damaged, stop and report it instead of forcing it open.
          NOTES
          else
            echo 'Developer ID-signed and Apple-notarized Mac build.' > "$RUNNER_TEMP/release-notes.md"
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
